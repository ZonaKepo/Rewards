<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poin Disiplin</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff8e7; --ink:#2b2438; --card:#ffffff; --line:#e9dfc8;
  --plus:#1f9d63; --plus-ink:#ffffff; --minus:#e5484d; --minus-ink:#ffffff;
  --accent:#6a4cff; --muted:#7a7388;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1726; --ink:#f3efff; --card:#272136; --line:#3a3250;
    --plus:#2fbf7a; --plus-ink:#07230f; --minus:#ff6369; --minus-ink:#2a0508;
    --accent:#9b87ff; --muted:#a69fb8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1726; --ink:#f3efff; --card:#272136; --line:#3a3250;
  --plus:#2fbf7a; --plus-ink:#07230f; --minus:#ff6369; --minus-ink:#2a0508;
  --accent:#9b87ff; --muted:#a69fb8; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:1.1rem}
.gear{background:none;border:0;font-size:1.8rem;cursor:pointer;padding:6px 10px;color:var(--muted)}
.score{background:var(--card);border:3px solid var(--line);border-radius:32px;padding:22px 16px;text-align:center}
.pts{font-size:clamp(5rem,26vw,10rem);line-height:1;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.pts.neg{color:var(--minus)}
.lbl{font-size:1.4rem;color:var(--muted);margin-top:2px}
.time{font-size:clamp(2rem,9vw,3.2rem);font-weight:800;margin-top:14px}
.group{display:flex;flex-direction:column;gap:10px}
.title{font-size:clamp(1.4rem,6vw,2rem);font-weight:800;padding-left:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:28px;padding:26px 8px;font:inherit;font-size:clamp(1.3rem,6vw,2rem);font-weight:800;cursor:pointer;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:focus-visible,.gear:focus-visible,.small:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.btn .big{font-size:2.6rem;line-height:1}
.plus{background:var(--plus);color:var(--plus-ink)}
.minus{background:var(--minus);color:var(--minus-ink)}
.undo{align-self:center;background:none;border:2px dashed var(--line);color:var(--muted);border-radius:20px;padding:12px 26px;font:inherit;font-size:1.2rem;cursor:pointer}
.undo:disabled{opacity:.4}
.panel{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:18px;display:none;flex-direction:column;gap:14px;font-size:1.2rem}
.panel.open{display:flex}
.panel label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel input{width:110px;font:inherit;font-size:1.4rem;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.small{font:inherit;font-size:1.1rem;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><span id="tgl"></span><button class="gear" id="gear" aria-label="Pengaturan">⚙️</button></div>

  <section class="score" aria-live="polite">
    <div class="pts" id="pts">0</div>
    <div class="lbl">poin</div>
    <div class="time" id="time">⏱ 0 menit</div>
  </section>

  <section class="group">
    <div class="title">🚪 Izin keluar kelas</div>
    <div class="row">
      <button class="btn plus" data-d="1" data-n="Izin keluar kelas"><span class="big">+1</span>Izin dulu</button>
      <button class="btn minus" data-d="-1" data-n="Keluar tanpa izin"><span class="big">−1</span>Tidak izin</button>
    </div>
  </section>

  <section class="group">
    <div class="title">🔒 Menutup pintu</div>
    <div class="row">
      <button class="btn plus" data-d="1" data-n="Tutup pintu pelan"><span class="big">+1</span>Sopan &amp; pelan</button>
      <button class="btn minus" data-d="-1" data-n="Pintu dibanting"><span class="big">−1</span>Dibanting</button>
    </div>
  </section>

  <button class="undo" id="undo">↩ Batalkan terakhir</button>

  <section class="panel" id="panel">
    <label>1 poin = <span><input id="mnt" type="number" min="1" max="240" inputmode="numeric"> menit</span></label>
    <button class="small" id="reset">Reset hari ini</button>
  </section>
</main>

<script>
(function(){
  var KEY="poinDisiplin.v1";
  var state={date:"",points:0,history:[],minutes:20};
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function load(){
    try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&typeof o==="object")state=Object.assign(state,o);}}catch(e){}
    checkDay();
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function checkDay(){
    var t=today();
    if(state.date!==t){state.date=t;state.points=0;state.history=[];save();}
  }
  function render(){
    var p=document.getElementById("pts");
    p.textContent=state.points;
    p.className="pts"+(state.points<0?" neg":"");
    var m=Math.max(0,state.points)*state.minutes;
    document.getElementById("time").textContent="⏱ "+m+" menit";
    document.getElementById("undo").disabled=state.history.length===0;
    document.getElementById("mnt").value=state.minutes;
    document.getElementById("tgl").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
  }
  document.querySelectorAll(".btn").forEach(function(b){
    b.addEventListener("click",function(){
      checkDay();
      var d=parseInt(b.dataset.d,10);
      state.points+=d;state.history.push(d);save();render();
      if(navigator.vibrate){try{navigator.vibrate(d>0?30:[60,40,60]);}catch(e){}}
    });
  });
  document.getElementById("undo").addEventListener("click",function(){
    var d=state.history.pop();
    if(d!==undefined){state.points-=d;save();render();}
  });
  document.getElementById("gear").addEventListener("click",function(){
    document.getElementById("panel").classList.toggle("open");
  });
  document.getElementById("mnt").addEventListener("change",function(e){
    var v=parseInt(e.target.value,10);
    if(v>0&&v<=240){state.minutes=v;save();}
    render();
  });
  document.getElementById("reset").addEventListener("click",function(){
    if(confirm("Reset poin hari ini jadi 0?")){state.points=0;state.history=[];save();render();}
  });
  document.addEventListener("visibilitychange",function(){if(!document.hidden){checkDay();render();}});
  load();render();
})();
</script>
</body>
</html>
